<!DOCTYPE html>
<!-- FIELD VARIANT 2 of 4: deep blue #0C1B3A. Reads blue at a glance. Alternate of index.html (variant 1 of 4, brand navy #0F2452)
     for selection; layout, emblem geometry, rule and text are identical. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Valor Technical Consulting : Coming Soon</title>
<meta name="description" content="Valor Technical Consulting, LLC. A new site is being prepared.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Valor Technical Consulting, LLC">
<meta property="og:title" content="Valor Technical Consulting : Coming Soon">
<meta property="og:description" content="Valor Technical Consulting, LLC. A new site is being prepared.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
:root {
  color-scheme: light dark;
  --navy: #0F2452;
  --gold: #FABF12;
  --cream: #FBF6E9;
  /* The splash field: deep blue: the brand navy taken down a step, still unmistakably blue. */
  --field: #0C1B3A;
  --texture-light: rgba(255, 255, 255, 0.045);
  --texture-gold: rgba(250, 191, 18, 0.09);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

/* The splash is a navy field by design in both colour schemes: the tokens are
   pinned, never re-derived from the user's light/dark preference, so no browser
   auto-inversion can occur. */
html, body {
  margin: 0;
  padding: 0;
  background-color: var(--field);
}

/* Navy surfaces are never flat: structural radial-gradient texture per the
   .hero convention in the firm stylesheet. */
body {
  min-height: 100vh;
  min-height: 100svh;
  background-image:
    radial-gradient(circle at 20% 0%, var(--texture-light) 0%, transparent 30%),
    radial-gradient(circle at 80% 100%, var(--texture-gold) 0%, transparent 40%);
  background-repeat: no-repeat;
  color: var(--cream);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

.splash {
  width: 100%;
  max-width: 46rem;
  padding: 6vmin 1.25rem;
  text-align: center;
}

/* Gold family eagle: geometry reused pixel for pixel from the firm mark, only
   the colour slots differ. Soft drop shadow follows the emblem silhouette. */
.emblem {
  display: block;
  width: clamp(140px, 30vmin, 280px);
  height: auto;
  margin: 0 auto clamp(1rem, 3.4vmin, 1.9rem);
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
}

.firm {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--cream);
  font-size: clamp(1.05rem, 4.4vmin, 2rem);
  line-height: 1.2;
  text-wrap: balance;
}

/* Gold rule sitting INSIDE the navy field, per the ribbon convention: a gold
   block within the navy, never a detached band. */
.rule {
  width: clamp(120px, 26vmin, 220px);
  height: 4px;
  margin: clamp(1rem, 3.4vmin, 1.8rem) auto;
  background: var(--gold);
}

.soon {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  /* Trailing letter-space is trimmed so the tracked text stays optically centred. */
  text-indent: 0.2em;
  color: var(--cream);
  font-size: clamp(0.92rem, 3.2vmin, 1.35rem);
  line-height: 1.4;
}

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

@media (max-width: 420px) {
  .firm { letter-spacing: 0.04em; }
  .soon { letter-spacing: 0.16em; text-indent: 0.16em; }
}

@media (prefers-reduced-motion: no-preference) {
  .splash > * {
    animation: splash-in 0.6s ease-out both;
  }
  .firm { animation-delay: 0.08s; }
  .rule { animation-delay: 0.14s; }
  .soon { animation-delay: 0.2s; }
  @keyframes splash-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
}
</style>
</head>
<body>
<main class="splash">
  <img class="emblem" src="assets/valor_logo_gold_darkblue.png" alt="Valor Technical Consulting emblem: gold eagle within a gold diamond on a deep blue field, with cream stars">
  <h1 class="firm">Valor Technical Consulting</h1>
  <div class="rule"></div>
  <p class="soon">Coming Soon</p>
</main>
</body>
</html>
